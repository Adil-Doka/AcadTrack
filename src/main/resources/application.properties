spring.application.name=Project-Manager

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/project_manager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:changeme-in-production-use-a-long-random-string-at-least-256-bits}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File storage
app.storage.location=${STORAGE_LOCATION:./uploads}
app.storage.max-file-size=10MB
app.storage.allowed-types=application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,image/png,image/jpeg,application/zip

# Team config
app.team.max-size=${TEAM_MAX_SIZE:4}
app.team.min-size=${TEAM_MIN_SIZE:2}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# GitHub
app.github.token=${GITHUB_TOKEN:}
app.github.api-base-url=https://api.github.com

# Coordinator Bootstrap Seed
app.coordinator.seed.enabled=${COORDINATOR_SEED_ENABLED:true}
app.coordinator.seed.pnr=${COORDINATOR_SEED_PNR:COORD001}
app.coordinator.seed.email=${COORDINATOR_SEED_EMAIL:coordinator@university.edu}
app.coordinator.seed.password=${COORDINATOR_SEED_PASSWORD:Coordinator@123}
app.coordinator.seed.name=${COORDINATOR_SEED_NAME:Project Coordinator}
app.coordinator.seed.department=${COORDINATOR_SEED_DEPT:Computer Science}

# Server
server.servlet.context-path=/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
