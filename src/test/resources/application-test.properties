# Test database - H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-to-work
app.jwt.expiration-ms=3600000

app.storage.location=${java.io.tmpdir}/project-manager-test-uploads
app.storage.max-file-size=10MB
app.storage.allowed-types=application/pdf,image/png

app.team.max-size=4
app.team.min-size=2

app.cors.allowed-origins=http://localhost:3000

app.github.token=
app.github.api-base-url=https://api.github.com

app.coordinator.seed.enabled=false

